<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Sign In</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

<!-- tailwind + daisy -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- fonts -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Css/style.css">

</head>
<body class="min-h-screen max-w-md mx-auto py-8">
  <div class="shadow-md">
    <div class="logo w-25 mx-auto pt-4">
        <img src="./assets/github-logo.png" alt="">
    </div>
      <h2 class="text-center font-semibold text-2xl text-[#1F2937] pt-4">GitHub Issues Tracker</h2>
        <p class="text-center font-normal text-[16px] text-[#64748B]">Sign in to manage your issues</p>
    <div class="form pt-10">
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow- mx-auto rounded-[24px]">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Username</label>
          <input id="input-text" type="text" class="input bg-base-200 rounded-[8px]" placeholder="Enter Username" />
          <p class="font-normal text-[14px] text-[#4A00FF]">Default: admin</p>
          <br>
         
          <label class="label text-neutral font-bold">Password</label>
          <input id="input-pass" type="password" class="input bg-base-200 rounded-[8px]" placeholder="Enter Password" />
          <p class="font-normal text-[14px] text-[#4A00FF]">Default: admin123</p>
          <button id="signIn-btn" type="button" class="btn bg-[#3B25C1] text-white rounded-full mt-4">Sign In</button>
     
       <div class="w-full max-w-md mx-auto mt-10">

   <div class="flex items-center my-6">
    
    <div class="flex-grow border-t border-gray-300"></div>
    
    <span class="mx-4 text-gray-400 text-sm">OR</span>
    
    <div class="flex-grow border-t border-gray-300"></div>

</div>

    <p class="text-center text-sm text-gray-500 mb-3">Demo Credentials:</p>

    <div class=" p-4 rounded-md text-center">
        <p class="text-gray-700">
            <span class="font-semibold">Username:</span> admin
        </p>
        <p class="text-gray-700">
            <span class="font-semibold">Password:</span> admin123
        </p>
    </div>

</div>
      </div>
    </div>
    </div>
    
  </div>
    

    <script src="./JS/signIn.js"></script>
</body>
</html>
