<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Issues Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>
<style>
.active-tab{
    background:#7c3aed;
    color:white;
}
</style>
<body class="bg-gray-100">

<!-- Header -->

<header class="bg-white shadow">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<div class="flex gap-1 items-center">
    <img class="w-10 h-10" src="assets/github-logo.png" alt="">
<h1 class="text-xl font-bold flex items-center gap-2">
   GitHub Issues Tracker
</h1>
</div>


<div class="flex gap-3">

<input id="searchInput" type="text" placeholder="Search issues..." class="input input-bordered border rounded px-3 py-2 text-sm w-60">

<button class="bg-purple-600 text-white px-4 py-2 rounded text-sm">
+ New Issue
</button>

</div>

</div>

</header>


<!-- Main -->

<main class="max-w-7xl mx-auto mt-8 px-6">

<!-- Filter -->

<div class="bg-white p-4 rounded shadow flex gap-3 mb-6">

<button id="allBtn" class="border px-4 py-2 rounded text-sm active-tab">
All
</button>

<button id="openBtn" class="border px-4 py-2 rounded text-sm">
Open
</button>

<button id="closedBtn" class="border px-4 py-2 rounded text-sm">
Closed
</button>

</div>


<!-- Issue Header -->

<div class="flex justify-between items-center  mb-6 shadow-md p-3">

<div class="flex gap-1 items-center">

<img  src="assets/Aperture.png" alt="">
<div>
    <h2 id="issueCount" class="font-bold text-lg">0 Issues</h2>

<p class="text-gray-500 text-sm">
Track and manage your project issues
</p>
</div>

</div>

<div class="flex gap-4 text-sm">

<span class="flex items-center gap-2">
<span class="w-3 h-3 bg-green-500 rounded-full"></span>
Open
</span>

<span class="flex items-center gap-2">
<span class="w-3 h-3 bg-purple-500 rounded-full"></span>
Closed
</span>

</div>

</div>


<!-- Card Container -->

<div id="issueContainer"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
</div>








<!-- Modal -->
<dialog id="task_modal" class="modal">
  <div class="modal-box max-w-xl relative p-6"> <!-- Added padding -->

    <!-- Close Button -->
    <button id="closeModalBtn" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 text-2xl">&times;</button>

   

    <!-- Title -->
    <h3 id="modalTitle" class="font-semibold text-lg mt-4">Loading...</h3>

    <!-- Meta info -->
    <div id="modalMeta" class="text-sm text-gray-400 mt-1">
      <!-- Status • Author • Date -->
    </div>

    <!-- Labels / Tags -->
    <div id="modalLabels" class="mt-4 flex gap-2 flex-wrap">
      <!-- Dynamically inserted labels -->
    </div>

    <!-- Description -->
    <p id="modalDescription" class="mt-4 text-gray-600">
      <!-- Dynamically inserted description -->
    </p>

    <!-- Assignee + Priority -->
    <div class="flex justify-between items-center mt-6 bg-gray-50 p-5 rounded-[12px]">
      <div>
        <p class="text-xs text-gray-400">Assignee</p>
        <p id="modalAssignee" class="font-medium">-</p>
      </div>

      <div class="text-right">
        <p class="text-xs text-gray-400">Priority</p>
        <span id="modalPriority" class="badge badge-success  bg-gray-200 px-2 rounded-full">-</span>
      </div>
    </div>

    <!-- Close Action -->
    <div class="modal-action mt-6">
      <form method="dialog">
        <button class="btn btn-primary text-purple-500">Close</button>
      </form>
    </div>

  </div>
</dialog>

</main>
<script src="JS/script.js"></script>
<script src="JS/json.js"></script>

</body>
</html>
